---
name: "Fork build (flower-card-av4k.js)"

# Rebuilds this fork's own bundle, flower-card-av4k.js, from src/ after every push to main,
# including a "Sync fork" from Olen/lovelace-flower-card. HACS installs this file (see hacs.json),
# so upstream's flower-card.js is never touched and syncing can't clash on the built file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-build
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'Olen/lovelace-flower-card'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Build fork bundle
        run: |
          npx webpack -c webpack.config.js
          cp flower-card.js flower-card-av4k.js
          gzip -9 -k -f flower-card-av4k.js
          git checkout -- flower-card.js flower-card.js.gz flower-card.js.LICENSE.txt

      - name: Commit if changed
        run: |
          if git diff --quiet -- flower-card-av4k.js flower-card-av4k.js.gz; then
            echo "Bundle unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flower-card-av4k.js flower-card-av4k.js.gz
          git commit -m "Rebuild flower-card-av4k.js"
          git push
