---
name: "Fork build (dist/flower-card.js)"

# Rebuilds this fork's own bundle from src/ after every push to main, including a "Sync fork"
# from Olen/lovelace-flower-card. HACS installs dist/flower-card.js (see hacs.json): HACS looks in
# dist/ first, and Olen's repo has no dist/, so syncing can't clash on the built file and upstream's
# root flower-card.js is never touched. The file must be called flower-card.js so the Home Assistant
# Plant integration (2026.11+) recognises it and stops loading its own bundled copy of the card.
# flower-card-av4k.js is still built for older installs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-build
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'Olen/lovelace-flower-card'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Build fork bundle
        run: |
          npx webpack -c webpack.config.js
          cp flower-card.js flower-card-av4k.js
          gzip -9 -k -f flower-card-av4k.js
          mkdir -p dist
          cp flower-card.js dist/flower-card.js
          gzip -9 -k -f dist/flower-card.js
          git checkout -- flower-card.js flower-card.js.gz flower-card.js.LICENSE.txt

      - name: Commit if changed
        run: |
          git add -f dist/flower-card.js dist/flower-card.js.gz
          if git diff --quiet -- flower-card-av4k.js flower-card-av4k.js.gz && git diff --cached --quiet; then
            echo "Bundle unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flower-card-av4k.js flower-card-av4k.js.gz
          git commit -m "Rebuild fork bundle (dist/flower-card.js)"
          git push
